;     bblanchon/ArduinoJson@^6.17.3

[esp32_common]
platform = espressif32
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/copy_ota_firmware.py
test_ignore =
    test_ota_image
    test_plausibility
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.17.3

[env:esp-wroom-32]
extends = esp32_common
board = upesy_wroom

; ESP32-S3 DevKitC-1 (USB-UART). `pio run` stays on esp-wroom-32.
; Build with: pio run -e esp32-s3
[env:esp32-s3]
extends = esp32_common
board = esp32-s3-devkitc-1
; On-board RGB LED is driven by status_led.cpp.
; GPIO26 is not on the DevKitC-1 header, so the trigger moves to GPIO4 (J1 pin 4).
build_flags =
    -DSTATUS_LED_RGB
    -DTRIG_PIN=4
    -DOTA_CHIP_ESP32S3

; Host test for the web OTA gate. `pio run` stays on esp-wroom-32.
[env:native]
platform = native
test_framework = custom
test_build_src = yes
build_src_filter = +<ota_image.cpp>
build_flags = -std=gnu++17

[platformio]
default_envs = esp-wroom-32
description = Measure rainwater level in well